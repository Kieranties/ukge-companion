name: Deploy UKGE Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh BGG collection
        working-directory: data-pipeline
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python fetch_collection.py

      - name: Resolve BGG ids for UKGE-listed games
        working-directory: data-pipeline
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python enrich_exhibitor_games.py

      - name: Commit refreshed cache
        # Commit the enriched exhibitor_games.json (and any refreshed
        # collection JSON) back to main so the next build is a cache hit.
        # `[skip ci]` keeps this commit from re-triggering the workflow.
        run: |
          if [[ -n "$(git status --porcelain web/src/data/exhibitor_games.json data-pipeline/kieranties_collection.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/data/exhibitor_games.json data-pipeline/kieranties_collection.json
            git commit -m "chore(data): refresh BGG cache [skip ci]"
            git push
          else
            echo "no cache changes to commit"
          fi

      - name: Build dashboard.json
        working-directory: data-pipeline
        run: python build_data.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Astro deps
        working-directory: web
        run: npm ci

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
